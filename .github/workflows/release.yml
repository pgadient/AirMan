name: Release

# Push a tag like v0.1.17 (the same number as __version__ in airman/__init__.py)
# to build AirMan for every platform and publish a GitHub release.
# "Run workflow" on the Actions page only builds: the files are attached to the run.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Least privilege: building only reads the repository.
permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            arch: x64
            asset: AirMan-windows-x64.exe
          - os: windows-11-arm
            arch: arm64
            asset: AirMan-windows-arm64.exe
          - os: macos-15
            arch: arm64
            asset: AirMan-macos-arm64.zip
          - os: macos-15-intel
            arch: x64
            asset: AirMan-macos-x64.zip
          # Ubuntu 22.04: the program also runs on older distributions (glibc 2.35+).
          - os: ubuntu-22.04
            arch: x64
            asset: AirMan-linux-x64.tar.gz
          - os: ubuntu-22.04-arm
            arch: arm64
            asset: AirMan-linux-arm64.tar.gz
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          architecture: ${{ matrix.arch }}
      - name: Tag matches the version in the code
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version=$(python -c "import airman; print(airman.__version__)")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match __version__ $version" >&2
            exit 1
          fi
      - name: Install pinned dependencies (hash-checked)
        run: python -m pip install --require-hashes -r requirements-build.txt
      - name: Unit tests
        run: python -m unittest discover -s tests
      - name: Build
        run: python build.py
      - name: Package
        shell: bash
        run: |
          mkdir out
          case "$RUNNER_OS" in
            Windows) cp dist/AirMan.exe "out/${{ matrix.asset }}" ;;
            macOS)   ditto -c -k --keepParent dist/AirMan.app "out/${{ matrix.asset }}" ;;
            Linux)   tar -czf "out/${{ matrix.asset }}" -C dist AirMan ;;
          esac
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.asset }}
          path: out/${{ matrix.asset }}
          if-no-files-found: error

  release:
    needs: build
    # Only for tags. Publish what was built even if one platform failed; the run
    # shows which one.
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: out
          merge-multiple: true
      - name: Checksums
        working-directory: out
        run: sha256sum AirMan-* > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" out/* --repo "$GITHUB_REPOSITORY" \
            --title "AirMan $TAG" --generate-notes
