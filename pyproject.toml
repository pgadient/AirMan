[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "airman"
description = "Your speakers, your music: play YouTube, internet radio and local files on AirPlay speakers (HomePod) from a simple web page."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dynamic = ["version"]
# Exact, hash-checked versions live in requirements.txt.
dependencies = [
  "pyatv>=0.18,<0.19",
  "yt-dlp[default]>=2026.8.19",
]

[project.scripts]
airman = "airman.__main__:main"

[tool.setuptools.dynamic]
version = { attr = "airman.__version__" }

[tool.setuptools.packages.find]
include = ["airman*"]

[tool.setuptools.package-data]
airman = ["static/**/*"]
